[project]
name = "py2so"
version = "0.3.0"
description = "将 Python 代码编译为 so 文件以保护源码，并输出可直接部署的工程目录"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "Cython",
    "setuptools",
]

[project.scripts]
py2so = "py2so.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py2so"]
